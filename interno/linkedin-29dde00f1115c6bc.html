<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>LinkedIn · SAS Consultora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFEDE6; --surface: #F7F6F1; --raised: #FFFFFF;
    --ink: #10251B; --ink-soft: #55665C; --line: #CFCEC4;
    --gold: #9A7818; --gold-bg: #F4EBD3;
    --good: #2F6B4C; --good-bg: #DFEBE3;
    --alert: #9C3A26; --alert-bg: #F4DCD5;
    --blue: #2E5C8A; --blue-bg: #E1EAF3;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F251B; --surface: #17301F; --raised: #1C3826;
      --ink: #E8EDE7; --ink-soft: #9BB0A2; --line: #2C4A36;
      --gold: #C9A227; --gold-bg: #2E2A12;
      --good: #6FBE93; --good-bg: #17331F;
      --alert: #E0846E; --alert-bg: #3A2018;
      --blue: #8FB4DE; --blue-bg: #16283A;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0F251B; --surface: #17301F; --raised: #1C3826;
    --ink: #E8EDE7; --ink-soft: #9BB0A2; --line: #2C4A36;
    --gold: #C9A227; --gold-bg: #2E2A12;
    --good: #6FBE93; --good-bg: #17331F;
    --alert: #E0846E; --alert-bg: #3A2018;
    --blue: #8FB4DE; --blue-bg: #16283A;
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; padding: 0 0 60px; max-width: 860px; margin: 0 auto; }
  h1,h2 { font-family: var(--display); font-weight: 600; }
  .mono { font-family: var(--mono); }
  header { padding: 28px 20px 18px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 26px; margin: 0 0 4px; }
  header p { color: var(--ink-soft); font-size: 13px; margin: 0; }
  a.back { color: var(--ink-soft); font-size: 13px; text-decoration: none; }
  main { padding: 20px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 2px; font-size: 17px; }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .03em; }
  .msg { background: var(--surface); border-radius: 8px; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; margin-bottom: 12px; }
  .actions { display: flex; gap: 10px; }
  button { font-family: var(--sans); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.aprobar { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  button.descartar { background: var(--alert-bg); color: var(--alert); border-color: var(--alert); }
  button:disabled { opacity: .5; cursor: default; }
  .vacio { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .cargando { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <a class="back" href="https://sasconsultora.com/interno/estado-29dde00f1115c6bc.html">← volver al estado general</a>
  <h1>LinkedIn</h1>
  <p>Mensajes 1 esperando tu aprobación antes de mandarse</p>
</header>
<main id="app"><div class="cargando">cargando…</div></main>
<script>
const API = "https://valncabvniutalzhovuc.supabase.co/functions/v1/linkedin-sas?k=29dde00f1115c6bc";
const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function cargar() {
  const app = document.getElementById("app");
  try {
    const r = await fetch(API, { cache: "no-store" });
    const d = await r.json();
    render(d.pendientes || []);
  } catch(e) {
    app.innerHTML = `<div class="vacio">No se pudo cargar: ${esc(e.message)}</div>`;
  }
}

function render(items) {
  const app = document.getElementById("app");
  if (!items.length) {
    app.innerHTML = `<div class="vacio">No hay mensajes esperando aprobación ahora mismo.</div>`;
    return;
  }
  app.innerHTML = items.map(p => `
    <div class="card" id="card-${p.id}">
      <h3>${esc(p.nombre)}</h3>
      <div class="meta">${esc(p.cargo||"")} · ${esc(p.empresa||"")} · ${esc(p.estado)}</div>
      <div class="msg">${esc(p.mensaje_1)}</div>
      <div class="actions">
        <button class="aprobar" onclick="accion(${p.id},'aprobar')">Aprobar (se manda solo, próxima corrida)</button>
        <button class="descartar" onclick="accion(${p.id},'descartar')">Descartar</button>
      </div>
    </div>
  `).join("");
}

async function accion(id, accion) {
  document.querySelectorAll(`#card-${id} button`).forEach(b => b.disabled = true);
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, accion })
    });
    if (!r.ok) throw new Error("error " + r.status);
    document.getElementById(`card-${id}`).remove();
  } catch(e) {
    alert("No se pudo: " + e.message);
    document.querySelectorAll(`#card-${id} button`).forEach(b => b.disabled = false);
  }
}

cargar();
</script>
</body>
</html>
